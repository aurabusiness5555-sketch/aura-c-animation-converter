<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockbench to Bloxd Animation Converter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f1117; color: #e2e8f0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 20px; margin: 0 0 18px; text-align: center; }
  .topbtns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .topbtns button { flex: none; }
  #download { background: linear-gradient(135deg, #3b82f6, #6ee7f7); border: none; color: #0f1117; }
  #openbb { background: #1e293b; border: 1px solid #334155; color: #94a3b8; }
  textarea {
    width: 100%; height: 200px; background: #1e293b; border: 1px solid #334155;
    border-radius: 8px; color: #e2e8f0; padding: 12px 14px; resize: vertical;
    font-family: 'Fira Code', 'Consolas', monospace; font-size: 12px;
    line-height: 1.6; outline: none;
  }
  .filerow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .filerow .label { font-size: 13px; color: #94a3b8; }
  .filerow button {
    flex: none; padding: 8px 16px; background: #1e293b; border: 1px solid #334155; color: #94a3b8;
  }
  #fileName { font-size: 12px; color: #64748b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .options { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: #94a3b8; }
  select, input[type="text"] {
    background: #1e293b; border: 1px solid #334155; border-radius: 7px;
    color: #e2e8f0; padding: 9px 10px; font-size: 13px; outline: none;
  }
  .buttons { display: flex; gap: 10px; margin-top: 10px; }
  button {
    flex: 1; padding: 11px 0; border-radius: 7px; font-weight: 700;
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  #convert { background: linear-gradient(135deg, #3b82f6, #6ee7f7); border: none; color: #0f1117; }
  #copy { background: #151c28; border: 1px solid #334155; color: #3a4a5c; cursor: default; }
  #copy.ready { background: #1e293b; color: #94a3b8; cursor: pointer; }
  #copy.done { background: #166534; border-color: #16a34a; color: #86efac; }
  button:not(:disabled):hover { filter: brightness(1.15); }
  button:not(:disabled):active { transform: scale(0.94); }
  #error {
    opacity: 0; max-height: 0; overflow: hidden; margin-top: 0; padding: 0 14px;
    background: #2d1b1b; border: 0 solid #7f1d1d; border-radius: 7px;
    color: #fca5a5; font-size: 13px; transition: all 1s ease;
  }
  #error.show {
    opacity: 1; max-height: 100px; margin-top: 12px; padding: 10px 14px; border-width: 1px;
  }
  #info { margin-top: 10px; font-size: 12px; color: #64748b; }
  pre {
    display: none; margin: 14px 0 0; background: #1e293b; border: 1px solid #334155;
    border-radius: 8px; padding: 14px 16px; color: #7dd3fc;
    font-family: 'Fira Code', 'Consolas', monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-all; line-height: 1.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbtns">
    <button type="button" id="download">Download Model</button>
    <button type="button" id="openbb">Open Blockbench</button>
  </div>

  <h1>Blockbench to Bloxd Animation Converter</h1>

  <textarea id="input"></textarea>

  <div class="filerow">
    <span class="label">Or File</span>
    <button type="button" id="browse">Browse</button>
    <span id="fileName"></span>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </div>

  <div class="options">
    <div class="field">
      <label for="entityId">Entity ID</label>
      <input type="text" id="entityId" value="myId">
    </div>
    <div class="field">
      <label for="loopMode">Playback</label>
      <select id="loopMode">
        <option value="auto">Auto Detect</option>
        <option value="true">Loop</option>
        <option value="false">Play once</option>
        <option value="hold_on_last_frame">Hold on last frame</option>
      </select>
    </div>
    <div class="field">
      <label for="lerpMode">Interpolation</label>
      <select id="lerpMode">
        <option value="auto">Auto Detect</option>
        <option value="linear">Linear</option>
        <option value="catmullrom">Smooth</option>
      </select>
    </div>
  </div>

  <div class="buttons">
    <button id="convert">Convert</button>
    <button id="copy" disabled>Copy</button>
  </div>

  <div id="error"></div>
  <div id="info"></div>
  <pre id="output"></pre>
</div>

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(data) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) c = CRC_TABLE[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildZip(files) {
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

  for (const f of files) {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);
    local.setUint16(8, 0, true);
    local.setUint16(10, dosTime, true);
    local.setUint16(12, dosDate, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, f.data.length, true);
    local.setUint32(22, f.data.length, true);
    local.setUint16(26, name.length, true);
    local.setUint16(28, 0, true);
    chunks.push(new Uint8Array(local.buffer), name, f.data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true);
    cd.setUint16(14, dosDate, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, f.data.length, true);
    cd.setUint32(24, f.data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);

    offset += 30 + name.length + f.data.length;
  }

  let cdSize = 0;
  for (const c of central) cdSize += c.length;

  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true);
  end.setUint32(16, offset, true);

  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
}

function downloadModel() {
  const bin = atob(MODEL_B64);
  const model = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) model[i] = bin.charCodeAt(i);
  const zip = buildZip([
    { name: "Model_to_animate.bbmodel", data: model },
    { name: "readme.txt", data: new TextEncoder().encode(README) }
  ]);
  const url = URL.createObjectURL(zip);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Animation Tool.zip";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function parseInput() {
  try { return JSON.parse($("input").value); }
  catch { throw new Error("Invalid JSON"); }
}

function mirrorPoint([x, y, z]) { return [-x, y, -z].map(round1); }

function convertPoint(vec, mirror) {
  const out = vec.map(round1);
  return mirror ? mirrorPoint(out) : out;
}

function convertFrame(value, mirror, lerp) {
  let frame;
  if (Array.isArray(value)) {
    frame = { post: convertPoint(value, mirror) };
  } else if (value && typeof value === "object") {
    frame = {};
    if (value.lerp_mode) frame.lerp_mode = value.lerp_mode;
    if (Array.isArray(value.pre)) frame.pre = convertPoint(value.pre, mirror);
    if (Array.isArray(value.post)) frame.post = convertPoint(value.post, mirror);
    if (!frame.post) frame.post = frame.pre ? frame.pre : [0, 0, 0];
  } else {
    frame = { post: [0, 0, 0] };
  }
  if (lerp !== "auto") frame.lerp_mode = lerp;
  return frame;
}

function resolveLoop(animLoop, choice) {
  if (choice === "true") return true;
  if (choice === "false") return false;
  if (choice === "hold_on_last_frame") return "hold_on_last_frame";
  if (animLoop === true) return true;
  if (animLoop === "hold_on_last_frame") return "hold_on_last_frame";
  return false;
}

function convertAnimation(parsed, loopChoice, lerpChoice) {
  let anim = parsed;
  if (parsed.animations && typeof parsed.animations === "object") {
    const keys = Object.keys(parsed.animations);
    if (!keys.length) throw new Error("No animations found.");
    anim = parsed.animations[keys[0]];
  }

  if (typeof anim.animation_length !== "number") {
    throw new Error("Missing animation_length.");
  }

  const result = {
    animation_length: anim.animation_length,
    loop: resolveLoop(anim.loop, loopChoice),
    bones: {},
  };

  for (const [boneName, boneData] of Object.entries(anim.bones ?? {})) {
    const outName = BONE_REMAP[boneName] ?? boneName;
    result.bones[outName] = {};

    for (const [channel, keyframes] of Object.entries(boneData)) {
      if (!["rotation", "position", "scale"].includes(channel)) continue;
      const doMirror = channel === "rotation" || channel === "position";
      const kfObj = Array.isArray(keyframes) ? { "0.0": keyframes } : keyframes;

      result.bones[outName][channel] = {};
      for (const [time, value] of Object.entries(kfObj)) {
        result.bones[outName][channel][time] = convertFrame(value, doMirror, lerpChoice);
      }
    }
  }
  return result;
}

$("download").addEventListener("click", downloadModel);
$("openbb").addEventListener("click", () => window.open("https://web.blockbench.net/", "_blank", "noopener"));

$("browse").addEventListener("click", () => $("fileInput").click());

$("fileInput").addEventListener("change", () => {
  const file = $("fileInput").files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    $("input").value = reader.result;
    $("fileName").textContent = file.name;
    $("fileInput").value = "";
  };
  reader.readAsText(file);
});

$("convert").addEventListener("click", () => {
  const err = $("error"), out = $("output"), copy = $("copy"), info = $("info");
  err.classList.remove("show"); out.style.display = "none"; info.textContent = "";
  copy.disabled = true; copy.className = ""; copy.textContent = "Copy";
  try {
    const result = convertAnimation(parseInput(), $("loopMode").value, $("lerpMode").value);
    const entityId = $("entityId").value.trim() || "myId";
    out.textContent = `api.animateEntity(${entityId}, ${JSON.stringify(result)});`;
    out.style.display = "block";
    copy.disabled = false; copy.className = "ready";
    info.textContent = `Length: ${result.animation_length}s | Loop: ${JSON.stringify(result.loop)} | Bones: ${Object.keys(result.bones).length}`;
  } catch (e) {
    err.textContent = e.message;
    err.classList.add("show");
  }
});

$("copy").addEventListener("click", async () => {
  const text = $("output").textContent;
  if (!text) return;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  $("copy").className = "done"; $("copy").textContent = "Copied!";
  setTimeout(() => { $("copy").className = "ready"; $("copy").textContent = "Copy"; }, 2000);
});
